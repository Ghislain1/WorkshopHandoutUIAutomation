name: CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore src/WorkshopHandoutUIAutomation.sln

    - name: Build
      run: dotnet build src/WorkshopHandoutUIAutomation.sln -c Debug --no-restore

    - name: Run unit tests
      run: dotnet test tests/CustomerApp.Tests/CustomerApp.Tests.csproj -c Debug --no-build

    - name: Run UI tests
      run: dotnet test tests/CustomerApp.UiTests -c Debug --no-build
